<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب واحد من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗓️ انتخاب واحد من</h1>
            <button id="darkModeToggle" title="تغییر حالت تاریک/روشن">🌙</button>
        </div>
        
        <div class="form-section" id="formSection">
            <h2 id="formTitle">افزودن درس جدید</h2>
            <form id="courseForm">
                <input type="hidden" id="editingCourseId" value="">
                
                <div class="form-group">
                    <label for="courseName">نام درس:</label>
                    <input type="text" id="courseName" required>
                </div>
                
                <div class="form-group">
                    <label for="courseUnits">تعداد واحد:</label>
                    <input type="text" id="courseUnits" inputmode="numeric" pattern="[0-9]*" value="3" required>
                </div>
                
                <div class="form-group">
                    <label>روزهای برگزاری:</label>
                    <div class="days-checkbox">
                        <label><input type="checkbox" name="courseDays" value="0"> شنبه</label>
                        <label><input type="checkbox" name="courseDays" value="1"> یکشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="2"> دوشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="3"> سه‌شنبه</label>
                        <label><input type="checkbox" name="courseDays" value="4"> چهارشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="5"> پنجشنبه</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="startTime">ساعت شروع کلاس:</label>
                    <select id="startTime" required>
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="endTime">ساعت پایان کلاس:</label>
                    <select id="endTime" required>
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="examDate">تاریخ امتحان :</label>
                    <div class="jalali-date">
                        <select id="examYear">
                            <option value="">سال</option>
                        </select>
                        <select id="examMonth">
                            <option value="">ماه</option>
                        </select>
                        <select id="examDay">
                            <option value="">روز</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="examStartTime">ساعت شروع امتحان:</label>
                    <select id="examStartTime">
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="examEndTime">ساعت پایان امتحان:</label>
                    <select id="examEndTime">
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <button type="submit" id="submitBtn">💾 افزودن به برنامه</button>
            </form>
        </div>
        
        <div id="errorMessages" class="error-container"></div>
        
        <div class="schedule-section">
            <h2>برنامه هفتگی</h2>
            <button type="button" id="printBtn" onclick="window.print()">📄 ذخیره PDF</button>
            <div class="table-container">
                <table id="scheduleTable">
                    <thead>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="selected-courses">
            <h2>دروس انتخاب شده</h2>
            <div class="total-units">
                مجموع واحدهای انتخابی: <span id="totalUnits">0</span>
            </div>
            <div class="total-days">
                تعداد روزهای حضور در دانشگاه : <span id="totalDays">0</span>
            </div>
            <ul id="courseList"></ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
