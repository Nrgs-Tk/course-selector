<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب واحد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗓️ انتخاب واحد</h1>
            <button id="darkModeToggle" title="تغییر حالت تاریک/روشن">🌙</button>
        </div>
        
        <div class="form-section" id="formSection">
            <h2 id="formTitle">افزودن درس جدید</h2>
            <form id="courseForm">
                <input type="hidden" id="editingCourseId" value="">
                
                <div class="form-group">
                    <label for="courseName">نام درس: <span class="required">*</span></label>
                    <input type="text" id="courseName" required>
                </div>
                
                <div class="form-group">
                    <label for="instructorName">نام استاد:</label>
                    <input type="text" id="instructorName">
                </div>
                
                <div class="form-group">
                    <label for="courseUnits">تعداد واحد: <span class="required">*</span></label>
                    <input type="text" id="courseUnits" inputmode="numeric" pattern="[0-9]*" required>
                </div>
                
                <div class="form-group">
                    <label>روزهای برگزاری: <span class="required">*</span></label>
                    <div class="days-checkbox">
                        <label><input type="checkbox" name="courseDays" value="0"> شنبه</label>
                        <label><input type="checkbox" name="courseDays" value="1"> یکشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="2"> دوشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="3"> سه‌شنبه</label>
                        <label><input type="checkbox" name="courseDays" value="4"> چهارشنبه</label>
                        <label><input type="checkbox" name="courseDays" value="5"> پنجشنبه</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="startTime">ساعت شروع کلاس: <span class="required">*</span></label>
                    <select id="startTime" required>
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="endTime">ساعت پایان کلاس: <span class="required">*</span></label>
                    <select id="endTime" required>
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>تاریخ امتحان:</label>
                    <div class="jalali-date">
                        <input type="text" id="examYear" placeholder="سال" maxlength="4" inputmode="numeric">
                        <span class="date-separator">/</span>
                        <input type="text" id="examMonth" placeholder="ماه" maxlength="2" inputmode="numeric">
                        <span class="date-separator">/</span>
                        <input type="text" id="examDay" placeholder="روز" maxlength="2" inputmode="numeric">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="examStartTime">ساعت شروع امتحان:</label>
                    <select id="examStartTime">
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="examEndTime">ساعت پایان امتحان:</label>
                    <select id="examEndTime">
                        <option value="">انتخاب ساعت...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>رنگ درس در برنامه:</label>
                    <div class="color-palette" id="colorPalette"></div>
                    <input type="hidden" id="selectedColor" value="">
                </div>
                
                <button type="submit" id="submitBtn">💾 افزودن به برنامه</button>
            </form>
        </div>
        
        <div id="errorMessages" class="error-container"></div>
        
        <div class="schedule-section">
            <h2>برنامه هفتگی</h2>
            <div class="schedule-actions">
                <button type="button" id="printBtn" onclick="window.print()">📄 ذخیره PDF</button>
                <button type="button" id="downloadImageBtn">📷 ذخیره تصویر</button>
            </div>
            <div class="table-container">
                <table id="scheduleTable">
                    <thead>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="selected-courses">
            <div class="stats-row">
                <div class="total-units">
                    مجموع واحدهای انتخابی: <span id="totalUnits">0</span>
                </div>
                <div class="total-days">
                    تعداد روزهای حضور در دانشگاه: <span id="totalDays">0</span>
                </div>
            </div>
            <h2>دروس انتخاب شده</h2>
            <ul id="courseList"></ul>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
